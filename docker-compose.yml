services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-prisma-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        echo '📦 Generating Prisma client...' &&
        npx prisma generate &&
        echo '🚀 Running database migrations...' &&
        npx prisma migrate deploy &&
        echo '✅ Starting development server...' &&
        npm run dev
      "
    restart: unless-stopped
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
